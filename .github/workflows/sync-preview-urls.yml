name: Deploy Preview Environment
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'apps/assistant-api/**'
      - 'config/**'

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Construct Render Preview URL
        id: render-url
        run: |
          PR_NUMBER=${{ github.event.number }}
          RENDER_PREVIEW_URL="https://studyspot-ui-pr-${PR_NUMBER}.onrender.com"
          echo "render_url=$RENDER_PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "Render preview URL: $RENDER_PREVIEW_URL"

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web

      - name: Deploy to Vercel Preview
        id: vercel-deploy
        run: |
          RENDER_URL="${{ steps.render-url.outputs.render_url }}"
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} -b NEXT_PUBLIC_ASSISTANT_API_URL="$RENDER_URL")
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $DEPLOYMENT_URL"
        working-directory: apps/web

      - name: Wait and verify Render deployment
        run: |
          RENDER_URL="${{ steps.render-url.outputs.render_url }}"
          echo "Waiting for Render deployment to be ready..."
          
          # Wait up to 10 minutes for Render to be ready
          for i in {1..60}; do
            if curl -f -s "$RENDER_URL/health" > /dev/null 2>&1; then
              echo "✅ Render deployment is ready at $RENDER_URL"
              break
            fi
            echo "⏳ Attempt $i/60: Render not ready yet, waiting 10s..."
            sleep 10
          done

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const renderUrl = '${{ steps.render-url.outputs.render_url }}';
            const vercelUrl = '${{ steps.vercel-deploy.outputs.deployment_url }}';
            const prNumber = context.issue.number;
            
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview Deployments Ready**
              
              - 📱 **Web App**: ${vercelUrl}
              - 🤖 **Assistant API**: ${renderUrl}
              
              The web app has been configured to use the assistant API preview URL automatically.`
            });
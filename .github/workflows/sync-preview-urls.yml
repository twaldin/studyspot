name: Sync Preview URLs
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'apps/web/**'
      - 'apps/assistant-api/**'

jobs:
  sync-preview-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for initial deployments
        run: |
          echo "Waiting 2 minutes for initial deployments to start..."
          sleep 120

      - name: Construct Render Preview URL
        id: render-url
        run: |
          PR_NUMBER=${{ github.event.number }}
          RENDER_PREVIEW_URL="https://studyspot-ui-pr-${PR_NUMBER}.onrender.com"
          echo "render_url=$RENDER_PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "Render preview URL: $RENDER_PREVIEW_URL"

      - name: Update Vercel Environment Variable
        run: |
          RENDER_URL="${{ steps.render-url.outputs.render_url }}"
          
          # Update the environment variable for this specific PR branch
          curl -X POST "https://api.vercel.com/v9/projects/${{ secrets.VERCEL_PROJECT_ID }}/env" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "key": "NEXT_PUBLIC_ASSISTANT_API_URL",
              "value": "'$RENDER_URL'",
              "type": "encrypted",
              "target": ["preview"],
              "gitBranch": "${{ github.head_ref }}"
            }' || echo "Environment variable may already exist"

      - name: Trigger Vercel Redeployment
        run: |
          # Get the latest deployment for this branch
          DEPLOYMENT_RESPONSE=$(curl -s "https://api.vercel.com/v6/deployments?projectId=${{ secrets.VERCEL_PROJECT_ID }}&gitSource=github&limit=1" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}")
          
          DEPLOYMENT_ID=$(echo $DEPLOYMENT_RESPONSE | jq -r '.deployments[0].uid')
          
          if [ "$DEPLOYMENT_ID" != "null" ]; then
            # Redeploy the latest deployment
            curl -X POST "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID/redeploy" \
              -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{}'
            echo "Triggered redeployment of $DEPLOYMENT_ID"
          else
            echo "No deployment found to redeploy"
          fi

      - name: Wait and verify Render deployment
        run: |
          RENDER_URL="${{ steps.render-url.outputs.render_url }}"
          echo "Waiting for Render deployment to be ready..."
          
          # Wait up to 10 minutes for Render to be ready
          for i in {1..60}; do
            if curl -f -s "$RENDER_URL/health" > /dev/null 2>&1; then
              echo "✅ Render deployment is ready at $RENDER_URL"
              break
            fi
            echo "⏳ Attempt $i/60: Render not ready yet, waiting 10s..."
            sleep 10
          done

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const renderUrl = '${{ steps.render-url.outputs.render_url }}';
            const prNumber = context.issue.number;
            
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview Deployments Ready**
              
              - 📱 **Web App**: Will be available at Vercel preview URL once redeployment completes
              - 🤖 **Assistant API**: ${renderUrl}
              
              The web app has been configured to use the assistant API preview URL automatically.`
            });
services:
  - type: web
    name: studyspot-assistant-api
    runtime: node
    buildCommand: pnpm install && pnpm build
    startCommand: node server.js
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    numInstances: 1